name: Aseprite Integration Tests

on:
  push:
    branches: ["*"]
    paths:
      - 'backend/aseprite/**'
      - 'tests/test_aseprite*.py'
      - '.github/workflows/aseprite-ci.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'backend/aseprite/**'
      - 'tests/test_aseprite*.py'

jobs:
  quality-checks:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy pytest pytest-cov pytest-asyncio
          pip install -r backend/requirements.txt

      - name: Run ruff linting
        run: |
          ruff check backend/aseprite/ tests/test_aseprite*.py --output-format=github
        continue-on-error: false

      - name: Run black formatting check
        run: |
          black --check backend/aseprite/ tests/test_aseprite*.py
        continue-on-error: false

      - name: Run isort import sorting check
        run: |
          isort --check-only backend/aseprite/ tests/test_aseprite*.py
        continue-on-error: false

      - name: Run mypy type checking
        run: |
          mypy backend/aseprite/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/test_aseprite_integration.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  workflow-tests:
    name: Workflow Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run workflow tests
        run: |
          pytest tests/test_aseprite_workflow.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, workflow-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio coverage

      - name: Run tests with coverage
        run: |
          pytest tests/test_aseprite*.py \
            --cov=backend/aseprite \
            --cov-report=term \
            --cov-report=html \
            --cov-report=xml \
            -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=85
        continue-on-error: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: aseprite-integration
          name: aseprite-coverage

      - name: Archive coverage HTML report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  integration-tests:
    name: Full Integration Tests
    runs-on: ubuntu-latest
    needs: coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run all Aseprite tests
        run: |
          pytest tests/test_aseprite*.py -v --tb=short --maxfail=5
        env:
          PYTHONPATH: ${{ github.workspace }}

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-benchmark

      - name: Run performance benchmarks
        run: |
          pytest tests/test_aseprite_workflow.py::test_performance_benchmarks -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests, workflow-tests, coverage, integration-tests, performance-benchmarks]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Quality Checks: ${{ needs.quality-checks.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Workflow Tests: ${{ needs.workflow-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Performance Benchmarks: ${{ needs.performance-benchmarks.result }}"

          if [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.workflow-tests.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          else
            echo "✅ All tests passed!"
          fi
