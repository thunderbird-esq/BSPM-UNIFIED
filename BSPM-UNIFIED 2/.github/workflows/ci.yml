name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          pip install flake8==6.1.0 black==23.12.1 isort==5.13.2

      - name: Run Black formatter check
        run: |
          black --check --line-length=120 "backend/" || echo "Black formatting issues found"

      - name: Run isort import sorting check
        run: |
          isort --check-only --profile black "backend/" || echo "Import sorting issues found"

      - name: Run Flake8 linter
        run: |
          flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503 --exclude=__pycache__,.git,venv --count --statistics

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing --cov-report=html --cov-fail-under=60
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r backend/requirements.txt --desc --format json --output audit-results.json || true
          pip-audit -r backend/requirements.txt --desc || true
        continue-on-error: true

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-audit
          path: audit-results.json

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -f backend/Dockerfile.intel-mac -t gbstudio-backend:test backend/

      - name: Build ComfyUI Docker image
        run: |
          docker build -f backend/comfyui/Dockerfile.intel-mac -t gbstudio-comfyui:test backend/comfyui/

      - name: Test docker-compose config
        run: |
          docker compose -f docker-compose.intel-mac.yml config

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx requests

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v -m integration || echo "Integration tests not yet implemented"
        continue-on-error: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker-build]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "✅ CI/CD Pipeline completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
