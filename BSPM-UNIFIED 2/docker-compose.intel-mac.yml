# GBStudio Automation Hub - Docker Compose Configuration
# Platform: Intel Mac (x86_64) - macOS Ventura 13.x
# Docker Desktop: 4.25+
# Version: 3.3 - Using local Ollama instance
#
# Usage:
#   Start: docker compose -f docker-compose.intel-mac.yml up -d
#   Stop:  docker compose -f docker-compose.intel-mac.yml down
#   Logs:  docker compose -f docker-compose.intel-mac.yml logs -f

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: gbstudio_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gbstudio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gbstudio_password_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-gbstudio_hub}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gbstudio_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gbstudio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: gbstudio_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_change_me} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - gbstudio_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # Backend - FastAPI application with PM agent
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.intel-mac
    container_name: gbstudio_backend
    ports:
      - "8000:8000"
    volumes:
      - ./project_files:/app/project_files:rw
      - ./vectorstore:/app/vectorstore:rw
      - ./agent_memory:/app/agent_memory:rw
      - ./temp_outputs:/app/temp_outputs:rw
      - ./app/logs:/app/logs:rw
      - ./app/secrets:/app/secrets:ro
      - ./frontend:/app/frontend:ro
    environment:
      # Connect to local Ollama running on host machine
      - GBSTUDIO_OLLAMA_API_URL=http://host.docker.internal:11434/api/generate
      - GBSTUDIO_OLLAMA_EMBEDDINGS_URL=http://host.docker.internal:11434/api/embeddings
      - GBSTUDIO_OLLAMA_TAGS_URL=http://host.docker.internal:11434/api/tags
      - GBSTUDIO_COMFYUI_API_URL=http://comfyui:8188

      # Models
      - GBSTUDIO_PM_MODEL=llama3
      - GBSTUDIO_EMBEDDING_MODEL=nomic-embed-text

      # Timeouts
      - GBSTUDIO_DEFAULT_TIMEOUT=90
      - GBSTUDIO_GENERATION_TIMEOUT=360

      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gbstudio}:${POSTGRES_PASSWORD:-gbstudio_password_change_me}@postgres:5432/${POSTGRES_DB:-gbstudio_hub}
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=10

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0
      - CACHE_TTL_SECONDS=300
      - SESSION_TTL_SECONDS=86400

      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      comfyui:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - gbstudio_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # ComfyUI - Stable Diffusion image generation
  # ============================================================================
  comfyui:
    build:
      context: ./backend/comfyui
      dockerfile: Dockerfile.intel-mac
    container_name: gbstudio_comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./comfyui_models:/app/ComfyUI/models:rw
      - comfyui_output:/app/ComfyUI/output:rw
      - comfyui_custom_nodes:/app/ComfyUI/custom_nodes:rw
    environment:
      - COMFYUI_DEVICE=cpu
      - PYTORCH_ENABLE_MPS_FALLBACK=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 4G
    networks:
      - gbstudio_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================================================================
  # Prometheus - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: gbstudio_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gbstudio_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Alertmanager - Alert Management
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: gbstudio_alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - gbstudio_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Grafana - Visualization & Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:10.1.5
    container_name: gbstudio_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - gbstudio_network
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
    name: gbstudio_postgres_data

  redis_data:
    driver: local
    name: gbstudio_redis_data

  comfyui_output:
    driver: local
    name: gbstudio_comfyui_output

  comfyui_custom_nodes:
    driver: local
    name: gbstudio_comfyui_custom_nodes

  prometheus_data:
    driver: local
    name: gbstudio_prometheus_data

  alertmanager_data:
    driver: local
    name: gbstudio_alertmanager_data

  grafana_data:
    driver: local
    name: gbstudio_grafana_data

# ============================================================================
# Network Configuration
# ============================================================================
networks:
  gbstudio_network:
    name: gbstudio_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
