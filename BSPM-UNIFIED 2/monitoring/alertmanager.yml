# Alertmanager Configuration for GBStudio Automation Hub
# Version: 1.0
# Platform: Intel Mac (macOS Ventura) + Docker
#
# This configuration defines:
# - Alert routing by severity
# - Notification channels (email, Slack, PagerDuty)
# - Grouping and throttling rules
# - Alert inhibition rules

global:
  # SMTP server configuration for email alerts
  smtp_from: 'alertmanager@gbstudio-hub.local'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

  # Default notification timeout
  resolve_timeout: 5m

  # Slack webhook URL (set via environment variable)
  # SLACK_WEBHOOK_URL: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'

  # PagerDuty integration key (set via environment variable)
  # PAGERDUTY_INTEGRATION_KEY: 'your-integration-key'

# Templates for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Alert routing tree
route:
  # Default receiver for all alerts
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'component', 'severity']

  # How long to wait before sending initial notification
  group_wait: 30s

  # How long to wait before sending notifications about new alerts in a group
  group_interval: 5m

  # How long to wait before re-sending an alert
  repeat_interval: 4h

  # Routes for specific alert types
  routes:
    # Critical alerts - page on-call immediately
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      continue: true

    # Warning alerts - create tickets
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 12h

    # Info alerts - log only
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 10m
      group_interval: 30m
      repeat_interval: 24h

    # Database alerts - special handling
    - match:
        component: database
      receiver: 'database-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

    # Security alerts - special handling
    - match:
        component: security
      receiver: 'security-team'
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 4h

# Alert inhibition rules (suppress certain alerts when others are firing)
inhibit_rules:
  # If backend is down, don't alert on high error rates
  - source_match:
      alertname: 'BackendDown'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['instance']

  # If database is down, don't alert on connection pool issues
  - source_match:
      alertname: 'PostgresDown'
    target_match:
      alertname: 'DatabaseConnectionPoolExhausted'
    equal: ['instance']

  # If Redis is down, don't alert on cache hit rate
  - source_match:
      alertname: 'RedisDown'
    target_match:
      alertname: 'LowCacheHitRate'
    equal: ['instance']

  # If disk is critical, suppress disk warning
  - source_match:
      alertname: 'DiskSpaceCritical'
    target_match:
      alertname: 'DiskSpaceWarning'
    equal: ['instance']

  # If memory is critical, suppress memory warning
  - source_match:
      alertname: 'MemoryUsageCritical'
    target_match:
      alertname: 'MemoryUsageWarning'
    equal: ['instance']

# Alert receivers/notification channels
receivers:
  # Default receiver - logs only
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9093/webhook'
        send_resolved: true

  # Critical alerts - page on-call via PagerDuty, notify Slack
  - name: 'critical-alerts'
    # PagerDuty integration
    pagerduty_configs:
      - service_key: '${PAGERDUTY_INTEGRATION_KEY}'
        severity: 'critical'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook }}'
          impact: '{{ .CommonAnnotations.impact }}'
        send_resolved: true

    # Slack notification
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        username: 'Alertmanager'
        icon_emoji: ':rotating_light:'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Impact:* {{ .CommonAnnotations.impact }}
          *Runbook:* {{ .CommonAnnotations.runbook }}
          *Firing Alerts:* {{ .Alerts.Firing | len }}
        color: 'danger'
        send_resolved: true

    # Email notification
    email_configs:
      - to: 'oncall@gbstudio-hub.local'
        headers:
          Subject: 'CRITICAL: {{ .GroupLabels.alertname }}'
        html: |
          <h2>CRITICAL ALERT</h2>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Impact:</strong> {{ .CommonAnnotations.impact }}</p>
          <p><strong>Runbook:</strong> {{ .CommonAnnotations.runbook }}</p>
          <p><strong>Firing Alerts:</strong> {{ .Alerts.Firing | len }}</p>
        send_resolved: true

  # Warning alerts - Slack + email (no page)
  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warning'
        username: 'Alertmanager'
        icon_emoji: ':warning:'
        title: 'WARNING: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook }}
          *Firing Alerts:* {{ .Alerts.Firing | len }}
        color: 'warning'
        send_resolved: true

    email_configs:
      - to: 'team@gbstudio-hub.local'
        headers:
          Subject: 'WARNING: {{ .GroupLabels.alertname }}'
        html: |
          <h2>WARNING ALERT</h2>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Runbook:</strong> {{ .CommonAnnotations.runbook }}</p>
        send_resolved: true

  # Info alerts - Slack only
  - name: 'info-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-info'
        username: 'Alertmanager'
        icon_emoji: ':information_source:'
        title: 'INFO: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
        color: 'good'
        send_resolved: true

  # Database team alerts
  - name: 'database-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#team-database'
        username: 'Alertmanager'
        icon_emoji: ':database:'
        title: '{{ if eq .GroupLabels.severity "critical" }}CRITICAL{{ else }}WARNING{{ end }}: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook }}
        color: '{{ if eq .GroupLabels.severity "critical" }}danger{{ else }}warning{{ end }}'
        send_resolved: true

    email_configs:
      - to: 'database-team@gbstudio-hub.local'
        headers:
          Subject: '{{ .GroupLabels.severity | toUpper }}: {{ .GroupLabels.alertname }}'
        send_resolved: true

  # Security team alerts
  - name: 'security-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#team-security'
        username: 'Alertmanager'
        icon_emoji: ':shield:'
        title: 'SECURITY: {{ .GroupLabels.alertname }}'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook }}
        color: '{{ if eq .GroupLabels.severity "critical" }}danger{{ else }}warning{{ end }}'
        send_resolved: true

    email_configs:
      - to: 'security-team@gbstudio-hub.local'
        headers:
          Subject: 'SECURITY ALERT: {{ .GroupLabels.alertname }}'
        send_resolved: true
