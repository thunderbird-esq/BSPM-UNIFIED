# Prometheus Configuration for GBStudio Automation Hub
# Version: 1.0
# Platform: Intel Mac (macOS Ventura) + Docker
#
# This configuration defines:
# - Scrape targets for backend metrics
# - Service discovery for horizontal scaling
# - Recording rules for aggregations
# - Alerting rules configuration

global:
  # How often to scrape targets
  scrape_interval: 15s

  # How often to evaluate rules
  evaluation_interval: 15s

  # Scrape timeout
  scrape_timeout: 10s

  # External labels attached to any time series or alerts
  external_labels:
    cluster: 'gbstudio-hub'
    environment: 'production'
    platform: 'intel-mac'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Load rules files
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/recording_rules.yml'

# Scrape configurations
scrape_configs:
  # ============================================================================
  # Prometheus Self-Monitoring
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # ============================================================================
  # Backend Application Metrics
  # ============================================================================
  - job_name: 'backend'
    # Scrape backend metrics endpoint
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'

    # Metrics endpoint
    metrics_path: '/metrics'

    # Scrape interval override (more frequent for application metrics)
    scrape_interval: 10s
    scrape_timeout: 5s

    # Relabeling configs to add metadata
    relabel_configs:
      # Add instance label
      - source_labels: [__address__]
        target_label: instance

      # Add job label
      - source_labels: [job]
        target_label: job

  # ============================================================================
  # PostgreSQL Database Metrics (via postgres_exporter)
  # ============================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

    scrape_interval: 15s
    scrape_timeout: 10s

  # ============================================================================
  # Redis Cache Metrics (via redis_exporter)
  # ============================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

    scrape_interval: 15s
    scrape_timeout: 10s

  # ============================================================================
  # Docker Container Metrics (via cAdvisor)
  # ============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'container-metrics'

    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ============================================================================
  # Node Exporter (System Metrics)
  # ============================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'system-metrics'

    scrape_interval: 15s
    scrape_timeout: 10s

  # ============================================================================
  # Service Discovery for Horizontal Scaling
  # ============================================================================
  # Docker Swarm service discovery (if using swarm mode)
  # - job_name: 'backend-swarm'
  #   dockerswarm_sd_configs:
  #     - host: unix:///var/run/docker.sock
  #       role: tasks
  #       port: 8000
  #
  #   relabel_configs:
  #     # Only keep backend services
  #     - source_labels: [__meta_dockerswarm_service_name]
  #       regex: backend.*
  #       action: keep
  #
  #     # Use container name as instance label
  #     - source_labels: [__meta_dockerswarm_container_label_com_docker_compose_service]
  #       target_label: instance

  # ============================================================================
  # File-based Service Discovery (for dynamic backends)
  # ============================================================================
  # - job_name: 'backend-dynamic'
  #   file_sd_configs:
  #     - files:
  #         - '/etc/prometheus/file_sd/backends.yml'
  #       refresh_interval: 30s
  #
  #   metrics_path: '/metrics'
  #   scrape_interval: 10s

# Storage configuration
storage:
  tsdb:
    # Retention time for data
    retention.time: 30d

    # Maximum storage size
    retention.size: 10GB

    # Compression
    wal_compression: true

# Remote write configuration (optional - for long-term storage)
