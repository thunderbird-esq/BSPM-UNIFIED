# GBStudio Automation Hub - Docker Compose Configuration
# Platform: Intel Mac (x86_64) - macOS Ventura 13.x
# Docker Desktop: 4.25+
# Version: 3.2 - Updated for project root execution
#
# Usage:
#   Start: docker compose -f docker-compose.intel-mac.yml up -d
#   Stop:  docker compose -f docker-compose.intel-mac.yml down
#   Logs:  docker compose -f docker-compose.intel-mac.yml logs -f

services:
  # ============================================================================
  # Backend - FastAPI application with PM agent
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.intel-mac
    container_name: gbstudio_backend
    ports:
      - "8000:8000"
    volumes:
      # Bind mounts for data persistence (paths relative to project root)
      - ./project_files:/app/project_files:rw
      - ./vectorstore:/app/vectorstore:rw
      - ./agent_memory:/app/agent_memory:rw
      - ./temp_outputs:/app/temp_outputs:rw
      - ./app/logs:/app/logs:rw
      - ./app/secrets:/app/secrets:ro
      - ./frontend:/app/frontend:ro
    environment:
      # Service URLs (Docker DNS resolves service names)
      - GBSTUDIO_OLLAMA_API_URL=http://ollama:11434/api/generate
      - GBSTUDIO_OLLAMA_EMBEDDINGS_URL=http://ollama:11434/api/embeddings
      - GBSTUDIO_OLLAMA_TAGS_URL=http://ollama:11434/api/tags
      - GBSTUDIO_COMFYUI_API_URL=http://comfyui:8188
      
      # Models
      - GBSTUDIO_PM_MODEL=llama3
      - GBSTUDIO_EMBEDDING_MODEL=nomic-embed-text
      
      # Timeouts
      - GBSTUDIO_DEFAULT_TIMEOUT=90
      - GBSTUDIO_GENERATION_TIMEOUT=360
      
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_started
      comfyui:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - gbstudio_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # Ollama - LLM inference engine
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: gbstudio_ollama
    platform: linux/amd64
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama:rw
    environment:
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 4G
    networks:
      - gbstudio_network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Starting Ollama server...' &&
        ollama serve &
        SERVER_PID=\$$! &&
        echo 'Waiting for Ollama server to be ready...' &&
        sleep 10 &&
        echo 'Pulling llama3 model (~4.7GB, may take 5-10 minutes)...' &&
        ollama pull llama3 &&
        echo 'Pulling nomic-embed-text model (~274MB)...' &&
        ollama pull nomic-embed-text &&
        echo 'Models ready. Ollama server running.' &&
        wait \$$SERVER_PID
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  # ============================================================================
  # ComfyUI - Stable Diffusion image generation
  # ============================================================================
  comfyui:
    build:
      context: ./backend/comfyui
      dockerfile: Dockerfile.intel-mac
    container_name: gbstudio_comfyui
    ports:
      - "8188:8188"
    volumes:
      # Bind mount to local models directory
      - ./comfyui_models:/app/ComfyUI/models:rw
      - comfyui_output:/app/ComfyUI/output:rw
      - comfyui_custom_nodes:/app/ComfyUI/custom_nodes:rw
    environment:
      - COMFYUI_DEVICE=cpu
      - PYTORCH_ENABLE_MPS_FALLBACK=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 4G
    networks:
      - gbstudio_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  ollama_models:
    driver: local
    name: gbstudio_ollama_models
  
  comfyui_output:
    driver: local
    name: gbstudio_comfyui_output
  
  comfyui_custom_nodes:
    driver: local
    name: gbstudio_comfyui_custom_nodes

# ============================================================================
# Network Configuration
# ============================================================================
networks:
  gbstudio_network:
    name: gbstudio_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
